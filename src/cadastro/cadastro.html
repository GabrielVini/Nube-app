<main class="register-page"><section class="brand-panel"><div class="glow one"></div><div class="glow two"></div><div class="brand-content"><img src="/nobe-logo.png" alt="Nobe Estágios"><div><span>COMECE AGORA</span><h1>Crie sua conta.<br><em>Transforme a gestão.</em></h1><p>Tenha seus contratos de estágio organizados em um espaço simples, rápido e feito para acompanhar sua rotina.</p></div></div></section>
<section class="form-panel"><div class="mobile-brand"><img src="/nobe-logo.png" alt="Nobe Estágios"></div><div class="register-card"><div class="intro"><span>CADASTRO</span><h2>Crie seu acesso</h2><p>Preencha seus dados para começar.</p></div><form (ngSubmit)="createAccount()" novalidate>
<div class="row"><label>Nome completo<div class="input"><i>○</i><input name="name" [(ngModel)]="name" placeholder="Seu nome completo" autocomplete="name" [class.invalid]="submitted&&!name.trim()"></div>@if(submitted&&!name.trim()){<small>Informe seu nome.</small>}</label><label>Matrícula<div class="input"><i>#</i><input name="registration" [(ngModel)]="registration" placeholder="Digite sua matrícula" [class.invalid]="submitted&&!registration.trim()"></div>@if(submitted&&!registration.trim()){<small>Informe sua matrícula.</small>}</label></div>
<div class="row"><label>E-mail<div class="input"><i>@</i><input type="email" name="email" [(ngModel)]="email" placeholder="seuemail@nobe.com.br" autocomplete="email" [class.invalid]="submitted&&!email.trim()"></div>@if(submitted&&!email.trim()){<small>Informe seu e-mail.</small>}</label><label>Telefone<div class="input"><i>⌕</i><input name="phone" [(ngModel)]="phone" placeholder="(00) 00000-0000" autocomplete="tel"></div></label></div>
<div class="row"><label>Senha<div class="input"><i>⌑</i><input [type]="showPassword?'text':'password'" name="password" [(ngModel)]="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" [class.invalid]="submitted&&password.length<8"><button type="button" (click)="showPassword=!showPassword">{{showPassword?'◉':'◌'}}</button></div>@if(submitted&&password.length<8){<small>Use pelo menos 8 caracteres.</small>}</label><label>Confirmar senha<div class="input"><i>⌑</i><input [type]="showPassword?'text':'password'" name="confirmation" [(ngModel)]="confirmation" placeholder="Repita sua senha" autocomplete="new-password" [class.invalid]="submitted&&(!confirmation||passwordMismatch)"></div>@if(submitted&&(!confirmation||passwordMismatch)){<small>As senhas devem ser iguais.</small>}</label></div>
@if(apiError){<div class="api-error"><span>!</span>{{apiError}}</div>}<button class="create" type="submit" [disabled]="loading">{{loading?'Criando conta...':'Criar minha conta'}} <span>{{loading?'···':'→'}}</span></button></form><p class="login-link">Já possui uma conta? <a routerLink="/login">Entrar</a></p></div></section></main>
